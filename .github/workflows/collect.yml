name: 일별 실제 값 자동 수집

on:
  schedule:
    # 매일 00:00 UTC = 09:00 KST
    - cron: '0 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 실시간 값 수집 및 records.json 갱신
        run: node scripts/collect.mjs

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- records.json; then
            echo "변경 없음 — 커밋 생략"
          else
            git add records.json
            git commit -m "chore: 일별 실제 값 자동 기록 ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
